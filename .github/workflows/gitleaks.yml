name: Secret Scan (gitleaks)

# Scans pushes and PRs for committed secrets (API keys, tokens, credentials).
# Complements the CSP hardening in this repo: keeps VITE_* secrets, Supabase
# service keys, and the frame-analyze worker's Anthropic key from ever landing
# in git history. .env is gitignored, but a workflow makes the guarantee
# enforceable in CI instead of relying on convention.

on:
  push:
  pull_request:
  schedule:
    # Sundays 10:00 UTC — weekly full-history sweep, matching the other
    # Cruze repos (platform 09:00, employee-hub 09:20, camera-viz 09:40).
    # Push/PR runs only scan the incoming commit range; the scheduled run
    # is what re-scans the entire history against newly-added gitleaks
    # rules, so anything that snuck past review still surfaces.
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so pushes are scanned across their whole commit range,
          # not just the tip commit.
          fetch-depth: 0

      # The gitleaks CLI, pinned and checksum-verified. gitleaks-action needs a
      # paid licence key for repos owned by an organization (this repo moved
      # to cruzelabs on 2026-11-11); the CLI is the same scanner without one.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      # A pull request scans only its own commits; a push to main, the weekly
      # sweep and a manual run scan the full history. Any hit fails the job.
      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .
          fi
